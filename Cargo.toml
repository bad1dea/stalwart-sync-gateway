[package]
name = "stalwart-sync-gateway"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
http = "1"
mail-parser = "1.0.2"
prometheus = "0.13"
pdf-extract = "0.12.1"
quick-xml = { version = "0.36", features = ["serialize"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "http2", "stream"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls-pki-types = "1"
rustls-webpki = { version = "0.103.15", features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.5", features = ["compression-gzip", "request-id", "trace", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
url = "2"
uuid = { version = "1", features = ["v4", "v5"] }
x509-parser = "0.18.1"
zip = { version = "=7.4.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
pretty_assertions = "1"
tokio-stream = { version = "0.1", features = ["sync"] }
